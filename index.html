<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중학생 온라인 계열 검사</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        .quiz-option {
            transition: background-color 0.2s ease, color 0.2s ease;
            cursor: pointer;
        }
        .quiz-option:hover {
            transform: translateY(-2px);
        }
        .quiz-option.selected {
            background-color: #60a5fa; /* Tailwind's blue-400 */
            color: white;
            border-color: #3b82f6; /* Tailwind's blue-500 */
        }
        .progress-bar {
            height: 8px;
            background-color: #e2e8f0; /* Tailwind's gray-200 */
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: #3b82f6; /* Tailwind's blue-500 */
            width: 0%;
            transition: width 0.3s ease-in-out;
        }
        .career-info-box {
            background-color: #f0f9ff; /* Tailwind's blue-50 */
            border: 1px solid #bfdbfe; /* Tailwind's blue-200 */
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-top: 1.5rem;
            text-align: left;
        }
        .career-info-box h4 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e40af; /* Tailwind's blue-800 */
            margin-bottom: 0.75rem;
        }
        .career-info-box p {
            font-size: 0.95rem;
            color: #374151; /* Tailwind's gray-700 */
            margin-bottom: 0.5rem;
        }
        .career-info-box ul {
            list-style: disc;
            padding-left: 1.5rem;
            color: #4b5563; /* Tailwind's gray-600 */
        }
        .career-info-box ul li {
            margin-bottom: 0.25rem;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-100 to-purple-100 flex items-center justify-center min-h-screen p-4">
    <div class="container mx-auto max-w-3xl w-full bg-white p-6 sm:p-8 rounded-2xl shadow-xl my-8">
        <div id="start-screen" class="text-center">
            <h1 class="text-3xl sm:text-4xl font-bold text-gray-800 mb-4">나의 흥미 계열 찾기</h1>
            <p class="text-lg text-gray-600 mb-8">중학생을 위한 온라인 계열 검사</p>
            <p class="text-md text-gray-700 mb-10">25개의 질문에 답하며 당신의 흥미와 적성에 맞는 계열을 찾아보세요!</p>
            <button id="start-btn" class="w-full max-w-xs bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg text-xl transition-transform transform hover:scale-105 shadow-md">검사 시작하기</button>
        </div>

        <div id="quiz-screen" class="hidden">
            <div class="mb-6">
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <div class="text-right text-sm text-gray-600 mt-2">
                    <span id="current-question-num">1</span> / <span id="total-questions-num">25</span>
                </div>
            </div>
            
            <div id="question-container" class="mb-8">
                <!-- Question will be injected here -->
            </div>
            
            <div class="flex justify-between"> <!-- 버튼 배치를 위해 justify-end에서 justify-between으로 변경 -->
                <button id="prev-btn" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-6 rounded-lg transition duration-300 opacity-50 cursor-not-allowed" disabled>이전 질문</button>
                <button id="submit-btn" class="hidden bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 rounded-lg transition duration-300">결과 보기</button>
            </div>
        </div>

        <div id="result-screen" class="hidden text-center">
            <h2 class="text-3xl font-bold text-gray-800 mb-4">나의 흥미 계열 결과</h2>
            <p class="text-xl text-gray-700 mb-6">당신의 흥미가 가장 높은 계열은 다음과 같습니다!</p>
            
            <div id="top-categories" class="mb-8 space-y-3">
                <!-- Top categories will be injected here -->
            </div>

            <div id="all-scores" class="bg-gray-50 p-6 rounded-lg shadow-inner mb-8">
                <h3 class="text-xl font-semibold text-gray-800 mb-4">계열별 점수</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-left">
                    <!-- All category scores will be injected here -->
                </div>
            </div>

            <div class="mt-8">
                <h3 class="text-2xl font-bold text-gray-800 mb-4">계열별 직업 안내</h3>
                <div class="relative inline-block w-full max-w-xs mb-4">
                    <select id="career-category-select" class="block appearance-none w-full bg-white border border-gray-300 hover:border-gray-400 px-4 py-2 pr-8 rounded-lg shadow leading-tight focus:outline-none focus:shadow-outline text-gray-700">
                        <!-- Options will be dynamically added -->
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                    </div>
                </div>
                <div id="career-info-display" class="career-info-box">
                    <!-- Career info will be displayed here -->
                </div>
            </div>

            <button id="restart-btn" class="mt-8 w-full max-w-xs bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg text-xl transition-transform transform hover:scale-105 shadow-md">다시 검사하기</button>
        </div>
    </div>

    <script>

                    { text: "숲, 강가, 천문대, 과학관", category: "자연과학" },

                    { text: "미술관, 공연장, 운동장", category: "예체능" },
                    { text: "병원, 보건소, 요양원", category: "의료보건" }
                ]
            },
            {
                question: "어떤 종류의 퍼즐이나 퀴즈를 가장 좋아하나요?",
                options: [
                    { text: "역사적 사건이나 인물에 대한 퀴즈", category: "인문사회" },
                    { text: "과학 원리나 자연 현상에 대한 퀴즈", category: "자연과학" },
                    { text: "논리 회로나 프로그래밍 관련 퍼즐", category: "공학" },
                    { text: "그림 맞추기나 음악 퀴즈", category: "예체능" },
                    { text: "인체 구조나 질병 관련 퀴즈", category: "의료보건" }
                ]
            },
            {
                question: "어떤 종류의 수업이 가장 흥미롭다고 생각하나요?",
                options: [
                    { text: "사회 현상을 분석하고 토론하는 수업", category: "인문사회" },
                    { text: "과학 실험을 통해 원리를 탐구하는 수업", category: "자연과학" },
                    { text: "로봇을 만들거나 코딩을 배우는 실습 수업", category: "공학" },
                    { text: "악기를 배우거나 그림을 그리는 실기 수업", category: "예체능" },
                    { text: "응급처치나 건강 관리법을 배우는 실용 수업", category: "의료보건" }
                ]
            }
        ];

        // 각 문제에 '잘 모르겠다' 옵션 추가
        quizData.forEach(question => {
            question.options.push({ text: "잘 모르겠다", category: "Neutral" });
        });

        const careerGuidance = {
            "인문사회": {
                description: "인간과 사회를 이해하고, 다양한 현상을 분석하며, 소통과 공감을 통해 문제를 해결하는 분야입니다. 사람과 사회에 대한 깊은 통찰력을 기를 수 있습니다.",
                professions: ["변호사", "작가", "선생님", "기자", "심리학자", "사회복지사", "외교관", "경찰관", "공무원", "역사학자"]
            },
            "자연과학": {

                professions: ["과학자 (물리, 화학, 생물, 지구과학)", "연구원", "대학교수", "기상학자", "천문학자", "생명공학자", "환경공학자", "수학자"]
            },
            "공학": {
                description: "과학적 지식과 기술을 활용하여 실생활에 유용한 제품이나 시스템을 만들고 개선하는 분야입니다. 문제 해결 능력이 뛰어나고 창의적인 것을 만드는 데 흥미가 있다면 좋습니다.",
                professions: ["소프트웨어 개발자", "건축가", "기계공학자", "전자공학자", "IT 전문가", "로봇 공학자", "데이터 과학자", "산업 디자이너", "토목공학자"]
            },
            "예체능": {
                description: "자신의 감성과 재능을 활용하여 아름다움을 창조하고 표현하는 분야입니다. 음악, 미술, 체육, 연극 등 다양한 예술 활동을 통해 사람들에게 즐거움과 감동을 선사합니다.",
                professions: ["화가", "음악가", "운동선수", "배우", "디자이너", "안무가", "사진작가", "만화가", "애니메이터", "감독"]
            },
            "의료보건": {
                description: "인간의 건강과 생명을 다루며, 질병을 예방하고 치료하며 건강한 삶을 돕는 분야입니다. 타인을 돕는 것에 보람을 느끼고 생명 존중의 마음을 가진 사람에게 적합합니다.",
                professions: ["의사", "간호사", "약사", "물리치료사", "영양사", "보건교사", "임상병리사", "수의사", "치과의사", "심리상담사"]
            }
        };

        const categories = ["인문사회", "자연과학", "공학", "예체능", "의료보건"];
        let categoryScores = {};
        let userSelections = new Array(quizData.length).fill(null); // 사용자의 선택을 저장할 배열 (카테고리 이름 저장)

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const startBtn = document.getElementById('start-btn');
        const prevBtn = document.getElementById('prev-btn'); // 이전 버튼 추가
        const submitBtn = document.getElementById('submit-btn');
        const restartBtn = document.getElementById('restart-btn');
        
        const questionContainer = document.getElementById('question-container');
        const currentQuestionNumEl = document.getElementById('current-question-num');
        const totalQuestionsNumEl = document.getElementById('total-questions-num');
        const progressFill = document.getElementById('progress-fill');

        const topCategoriesEl = document.getElementById('top-categories');
        const allScoresEl = document.querySelector('#all-scores .grid');
        const careerCategorySelect = document.getElementById('career-category-select');
        const careerInfoDisplay = document.getElementById('career-info-display');

        let currentQuestionIndex = 0;

        function initializeScores() {
            categories.forEach(cat => {
                categoryScores[cat] = 0;
            });
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startQuiz() {
            initializeScores();
            userSelections = new Array(quizData.length).fill(null); // 검사 시작 시 사용자 선택 초기화

            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            resultScreen.classList.add('hidden');
            currentQuestionIndex = 0;
            totalQuestionsNumEl.textContent = quizData.length; // Dynamically set total questions
            showQuestion();
        }

        function showQuestion() {
            const questionData = quizData[currentQuestionIndex];
            currentQuestionNumEl.textContent = currentQuestionIndex + 1;
            updateProgressBar();
            
            // 보기를 무작위로 섞기
            const shuffledOptions = shuffleArray([...questionData.options]);

            questionContainer.innerHTML = `
                <p class="text-xl font-medium text-gray-900 mb-6">${currentQuestionIndex + 1}. ${questionData.question}</p>
                <div class="space-y-4">
                    ${shuffledOptions.map((option) => `
                        <div class="quiz-option bg-gray-50 border border-gray-200 p-4 rounded-lg shadow-sm hover:bg-blue-50 hover:border-blue-300" data-option-text="${option.text}" data-category="${option.category}">
                            ${option.text}
                        </div>
                    `).join('')}
                </div>
            `;

            // Add event listeners to new options
            const options = questionContainer.querySelectorAll('.quiz-option');
            options.forEach(opt => {
                opt.addEventListener('click', (event) => selectOption(event.currentTarget));
            });

            // 이전에 선택한 보기가 있다면 'selected' 클래스 적용
            if (userSelections[currentQuestionIndex] !== null) {
                const prevSelectedText = userSelections[currentQuestionIndex];
                const prevSelectedOptionElement = questionContainer.querySelector(`[data-option-text="${prevSelectedText}"]`);
                if (prevSelectedOptionElement) {
                    prevSelectedOptionElement.classList.add('selected');
                }
            }

            // 첫 번째 질문일 경우 이전 버튼 비활성화
            if (currentQuestionIndex === 0) {
                prevBtn.classList.add('opacity-50', 'cursor-not-allowed');
                prevBtn.disabled = true;
            } else {
                prevBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                prevBtn.disabled = false;
            }

            // 마지막 질문일 경우 '결과 보기' 버튼 표시, 아니면 숨김
            if (currentQuestionIndex === quizData.length - 1) {
                submitBtn.classList.remove('hidden');
            } else {
                submitBtn.classList.add('hidden');
            }
        }
        
        function selectOption(element) {
            const options = questionContainer.querySelectorAll('.quiz-option');
            options.forEach(opt => opt.classList.remove('selected')); // 모든 옵션에서 selected 클래스 제거

            element.classList.add('selected'); // 현재 선택된 옵션에 selected 클래스 추가
            
            const selectedOptionText = element.dataset.optionText;
            userSelections[currentQuestionIndex] = selectedOptionText; // 사용자 선택 저장 (텍스트로 저장)

            // 옵션을 선택하면 바로 다음 질문으로 넘어가거나 결과를 표시
            setTimeout(() => { // 시각적인 선택 효과를 위해 약간의 딜레이
                if (currentQuestionIndex === quizData.length - 1) {
                    showResults(); // 마지막 질문이면 결과 보기
                } else {
                    currentQuestionIndex++;
                    showQuestion(); // 다음 질문으로 이동
                }
            }, 300); // 0.3초 딜레이
        }

        function updateProgressBar() {
            const progress = ((currentQuestionIndex + 1) / quizData.length) * 100;
            progressFill.style.width = `${progress}%`;
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                showQuestion();
            }
        }

        function showResults() {
            // 모든 질문에 대한 답변이 완료되었는지 최종 확인
            if (userSelections.some(selection => selection === null)) {
                // alert('모든 질문에 답변을 완료해주세요!'); // 이제 옵션 선택 시 자동으로 넘어가므로 이 경고는 필요 없을 수 있습니다.
                return;
            }

            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            // 점수 초기화 및 재계산
            initializeScores(); // 모든 카테고리 점수를 0으로 초기화
            userSelections.forEach(selectedOptionText => {
                if (selectedOptionText) { // null이 아닌 경우에만 점수 추가
                    // 선택된 옵션 텍스트에 해당하는 카테고리 찾기
                    let categoryFound = false;
                    for (const question of quizData) {
                        const option = question.options.find(opt => opt.text === selectedOptionText);
                        // '잘 모르겠다' 옵션은 점수 계산에서 제외
                        if (option && option.category !== "Neutral") {
                            categoryScores[option.category]++;
                            categoryFound = true;
                            break;
                        } else if (option && option.category === "Neutral") {
                            categoryFound = true; // Neutral 옵션도 찾았지만 점수 계산은 안 함
                            break;
                        }
                    }
                    if (!categoryFound) {
                        console.warn(`Category not found for option: ${selectedOptionText}`);
                    }
                }
            });

            // 결과 표시 로직 (이전과 동일)
            const sortedCategories = Object.entries(categoryScores).sort(([, scoreA], [, scoreB]) => scoreB - scoreA);

            topCategoriesEl.innerHTML = '';
            allScoresEl.innerHTML = '';

            const topScore = sortedCategories[0][1];
            const topCategoryNames = sortedCategories.filter(([, score]) => score === topScore).map(([name]) => name);

            if (topCategoryNames.length === 1) {
                topCategoriesEl.innerHTML = `
                    <p class="text-3xl font-bold text-blue-600">${topCategoryNames[0]} 계열</p>
                    <p class="text-lg text-gray-700 mt-2">당신은 ${topCategoryNames[0]} 분야에 강한 흥미와 적성을 가지고 있습니다!</p>
                `;
            } else {
                topCategoriesEl.innerHTML = `
                    <p class="text-3xl font-bold text-blue-600">${topCategoryNames.join(', ')} 계열</p>
                    <p class="text-lg text-gray-700 mt-2">당신은 여러 분야에 흥미를 가지고 있으며, 특히 ${topCategoryNames.join(', ')} 분야에 강한 적성이 있습니다!</p>
                `;
            }

            sortedCategories.forEach(([category, score]) => {
                allScoresEl.innerHTML += `
                    <div class="flex justify-between items-center bg-white p-3 rounded-md shadow-sm">
                        <span class="font-medium text-gray-700">${category}</span>
                        <span class="font-bold text-blue-500">${score}점</span>
                    </div>
                `;
            });

            // 직업 안내 드롭다운 및 초기 정보 표시
            populateCareerSelect(topCategoryNames[0]); 
        }

        function populateCareerSelect(defaultCategory) {
            careerCategorySelect.innerHTML = '';
            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                careerCategorySelect.appendChild(option);
            });
            careerCategorySelect.value = defaultCategory; // Set default selected option
            displayCategoryCareerInfo(defaultCategory); // Display info for default category
        }

        function displayCategoryCareerInfo(categoryName) {
            const info = careerGuidance[categoryName];
            if (info) {
                careerInfoDisplay.innerHTML = `
                    <h4>${categoryName} 계열</h4>
                    <p>${info.description}</p>
                    <h5 class="font-semibold mt-4 mb-2 text-gray-800">관련 직업 예시:</h5>
                    <ul>
                        ${info.professions.map(p => `
                            <li>
                                ${p} 
                            </li>
                        `).join('')}
                    </ul>
                `;
            } else {
                careerInfoDisplay.innerHTML = `<p>선택된 계열에 대한 정보가 없습니다.</p>`;
            }
        }

        // Event Listeners
        startBtn.addEventListener('click', startQuiz);
        prevBtn.addEventListener('click', previousQuestion); // 이전 버튼 이벤트 리스너 추가
        submitBtn.addEventListener('click', showResults);
        restartBtn.addEventListener('click', startQuiz);
        careerCategorySelect.addEventListener('change', (event) => {
            displayCategoryCareerInfo(event.target.value);
        });

    </script>
